<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Tunelyrics - Register</title>
</head>
<body>

<section>

    <div class="row">
        <div class="col-sm-6 offset-md-3 pt-3">
            <h1 class="text-center">Register</h1>

            <!-- SINGLE FORM -->
            <form th:action="@{/register}" th:object="${userDto}" method="post">

                <!-- Email input -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" required>
                </div>

                <!-- Password input -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" id="password" required>
                </div>

                <!-- Terms checkbox -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="registerCheck" required>
                    <label class="form-check-label" for="registerCheck">
                        I have read and agree to the terms
                    </label>
                </div>

                <!-- Submit button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-block mb-4">Sign up</button>
                </div>

                <!-- Login link -->
                <div class="text-center">
                    <p>Already a member? <a href="/login">Login</a></p>
                </div>

            </form>

        </div>
    </div>

</section>

</body>
</html>
