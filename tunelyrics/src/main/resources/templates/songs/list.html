<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>All Songs - Tunelyrics</title>
</head>
<body>
<section>
    <div class="row">
        <div class="col-sm-10 offset-md-1 pt-5">
            <h1>All Songs</h1>

            <a href="/songs/upload" class="btn btn-success mb-3">Upload New Song</a>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="song : ${songs}">
                    <td th:text="${song.title}">Song Title</td>
                    <td th:text="${song.artist}">Artist Name</td>
                    <td>
                        <a th:href="@{/songs/{id}(id=${song.id})}" class="btn btn-primary btn-sm">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
