<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${song.title} + ' - Tunelyrics'">Song Title</title>
</head>
<body>
<section>
    <div class="row">
        <div class="col-sm-10 offset-md-1 pt-5">
            <h1 th:text="${song.title}">Song Title</h1>
            <h4 th:text="${song.artist}">Artist Name</h4>

            <div class="mb-3">
                <h5>Lyrics:</h5>
                <!-- Use <pre> to preserve line breaks and formatting -->
                <pre th:text="${song.lyrics}">Lyrics go here...</pre>
            </div>

            <div class="mb-3">
                <h5>Links:</h5>
                <a th:href="${song.youtubeUrl}" target="_blank" class="btn btn-danger btn-sm mb-1">YouTube</a>
                <a th:href="${song.spotifyUrl}" target="_blank" class="btn btn-success btn-sm mb-1">Spotify</a>
                <a th:href="${song.mp3Url}" target="_blank" class="btn btn-primary btn-sm mb-1">MP3</a>
            </div>

            <div>
                <a href="/songs" class="btn btn-secondary">Back to Songs</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
